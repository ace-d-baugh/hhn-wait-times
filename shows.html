<title>Shows — HHN Wait Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg-0:#050304; --blood-bright:#ff2a3a; --pumpkin:#ff7518; --bone:#e8dcc8; --muted:#7a6d68; --card-bg:#140a0c; --card-border:#3a1015; }
  *{ box-sizing:border-box; }
  html,body{ min-height:100%; margin:0; background:var(--bg-0); color:var(--bone); font-family:'Oswald','Segoe UI',sans-serif; }
  .wrap{ max-width:640px; margin:0 auto; padding:8vh 20px 6vh; text-align:center; }
  h1{ font-family:'Nosifer',cursive; font-size:clamp(24px,5vw,40px); color:var(--blood-bright); text-shadow:0 0 12px rgba(255,42,58,.5); margin:0 0 8px; }
  .tagline{ color:var(--muted); font-size:14px; letter-spacing:.5px; margin:0 0 8px; }
  .park-note{ color:var(--muted); font-size:12px; margin:0 0 44px; }

  .show-block{ margin-bottom:40px; text-align:left; }
  .show-block:last-of-type{ margin-bottom:0; }
  .show-name{ font-size:18px; font-weight:600; color:var(--bone); margin:0 0 2px; }
  .show-venue{ color:var(--muted); font-size:12.5px; letter-spacing:.3px; text-transform:uppercase; margin:0 0 16px; }

  .show-times{ display:flex; flex-wrap:wrap; gap:10px 12px; }
  .show-time{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:15px;
    color:var(--bone); background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; padding:9px 14px; line-height:1;
    transition:opacity .3s ease;
  }
  .show-time.passed{ color:var(--muted); opacity:.45; }
  .show-time.next{
    font-size:23px; font-weight:700; color:var(--blood-bright);
    border-color:var(--blood-bright);
    text-shadow:0 0 8px rgba(255,42,58,.8), 0 0 18px rgba(255,42,58,.45);
    box-shadow:0 0 14px rgba(255,42,58,.35);
    padding:7px 16px;
  }

  .back-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:44px; }
  .back{ display:inline-block; color:var(--pumpkin); text-decoration:none; border:1px solid var(--card-border); padding:8px 18px; border-radius:8px; }
  .back:hover{ border-color:var(--blood-bright); }
  .copyright{ margin-top:28px; color:var(--muted); font-size:11.5px; }
  .copyright a{ color:var(--muted); }
  .copyright a:hover{ color:var(--pumpkin); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Shows</h1>
    <p class="tagline">Live show schedule</p>
    <p class="park-note">Universal Studios Florida — Halloween Horror Nights</p>

    <div class="show-block">
      <p class="show-name">Stranger Things: Return to Hawkins</p>
      <p class="show-venue">Lagoon show</p>
      <div class="show-times" id="show-times-stranger-things"></div>
    </div>

    <div class="show-block">
      <p class="show-name">Nightmare Fuel: Blood Noir</p>
      <p class="show-venue">Stage show</p>
      <div class="show-times" id="show-times-nightmare-fuel"></div>
    </div>

    <div class="back-row">
      <a class="back" href="index.html">&larr; Back to wait times</a>
      <a class="back" href="about.html">About</a>
    </div>

    <p class="copyright">&copy; 2026 <a href="https://digitalelegance.com" target="_blank" rel="noopener">Digital Elegance LLC</a></p>
  </div>

<script>
  const SHOWS = [
    { id: 'show-times-stranger-things', times: ['21:00', '21:45', '22:30', '23:15', '00:00', '00:45'] },
    { id: 'show-times-nightmare-fuel', times: ['20:00', '21:30', '23:00', '00:30'] }
  ];

  // Show nights run from evening into the small hours, so any time before
  // 6 a.m. is treated as a continuation of that same night rather than a
  // fresh day — otherwise "12:45 AM" would sort as earlier than "9:00 PM".
  function adjustedMinutes(hour, minute) {
    const adjHour = hour < 6 ? hour + 24 : hour;
    return adjHour * 60 + minute;
  }

  function parkNowMinutes() {
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute: '2-digit'
    });
    const parts = {};
    fmt.formatToParts(new Date()).forEach(p => { if (p.type !== 'literal') parts[p.type] = p.value; });
    const hour = parseInt(parts.hour, 10) % 24;
    const minute = parseInt(parts.minute, 10);
    return adjustedMinutes(hour, minute);
  }

  function formatTime12(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ':' + String(m).padStart(2, '0') + ' ' + period;
  }

  function renderShows() {
    const nowMin = parkNowMinutes();

    SHOWS.forEach(show => {
      const container = document.getElementById(show.id);
      container.innerHTML = '';

      const minutesForTimes = show.times.map(t => {
        const [h, m] = t.split(':').map(Number);
        return adjustedMinutes(h, m);
      });
      const nextIndex = minutesForTimes.findIndex(min => min >= nowMin);

      show.times.forEach((t, i) => {
        const chip = document.createElement('span');
        chip.className = 'show-time';
        if (i === nextIndex) chip.className += ' next';
        else if (minutesForTimes[i] < nowMin) chip.className += ' passed';
        chip.textContent = formatTime12(t);
        container.appendChild(chip);
      });
    });
  }

  renderShows();
  setInterval(renderShows, 30000);
</script>
</body>
</html>
