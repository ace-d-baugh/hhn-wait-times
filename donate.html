<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donate — Halloween Horror Nights Wait Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg-0:#050304; --blood-bright:#ff2a3a; --pumpkin:#ff7518; --bone:#e8dcc8; --muted:#7a6d68; --card-border:#3a1015; }
  *{ box-sizing:border-box; }
  html,body{ min-height:100%; margin:0; background:var(--bg-0); color:var(--bone); font-family:'Oswald','Segoe UI',sans-serif; }
  .wrap{ max-width:640px; margin:0 auto; padding:8vh 20px; text-align:center; }
  h1{ font-family:'Nosifer',cursive; font-size:clamp(24px,5vw,40px); color:var(--blood-bright); text-shadow:0 0 12px rgba(255,42,58,.5); margin:0 0 24px; }
  p{ line-height:1.6; color:var(--muted); font-size:15px; }
  .back{ display:inline-block; margin-top:32px; color:var(--pumpkin); text-decoration:none; border:1px solid var(--card-border); padding:8px 18px; border-radius:8px; }
  .back:hover{ border-color:var(--blood-bright); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Donate</h1>
    <p>A donation link is coming soon. If you'd like to support this project in the meantime, just spread the word.</p>
    <a class="back" href="index.html">&larr; Back to wait times</a>
  </div>
</body>
</html>
